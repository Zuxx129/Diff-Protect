attack:
    epsilon: 16
    steps: 100
    input_size: 1024
    mode: A               # MMDiT attack mode: O/O_repo/O_fair/A/B/C/D
    img_path: test_images/to_protect
    output_path: out_sd3/
    alpha: 1
    g_mode: "+"            # Backward-compatible: '+' -> maximize, '-' -> minimize
    opt_direction: maximize # Preferred objective direction: maximize or minimize
    objective_convention: larger_is_more_attack
    textual_objective: toward_target  # toward_target or away_from_target
    debug_grad: False      # Print textual/mmdit/total grad norms at first/last step
    capture_blocks: [0, 6, 12, 17]  # Sparse MMDiT blocks for feature/attention hooks; null -> all blocks
    use_wandb: False
    project_name: sd3_mist
    textual_weight: 1.0    # Weight for textual loss (VAE latent push)
    mmdit_weight: 1.0      # Weight for MMDiT-specific loss
    device: "cuda:2"       # Target GPU device
    max_exp_num: 100
    model_name: "stabilityai/stable-diffusion-3.5-medium"  # ModelScope model ID (uses local cache)
